[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "deskaone-sdk-python"
version = "0.1.0"
description = "Async Python SDK foundation for DesKaOne networking and proxy features."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DesKaOne" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]


[tool.ruff]
line-length = 100
target-version = "py311"

